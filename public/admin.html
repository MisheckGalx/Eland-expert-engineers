<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Eland Admin</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh;}
    /* LOGIN */
    .login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0b1f3a,#1a3d6e);}
    .login-box{background:#fff;border-radius:20px;padding:48px;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,0.3);}
    .login-logo{font-size:13px;font-weight:800;letter-spacing:0.15em;color:#0b1f3a;text-transform:uppercase;margin-bottom:32px;}
    .login-logo span{color:#f4640a;}
    .login-box h2{font-size:22px;color:#0b1f3a;margin-bottom:6px;}
    .login-box p{color:#999;font-size:13px;margin-bottom:28px;}
    /* ADMIN */
    .admin{display:none;}
    .topbar{background:#0b1f3a;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .topbar-logo{color:#fff;font-size:14px;font-weight:700;letter-spacing:0.05em;}
    .topbar-logo span{color:#f4640a;}
    .topbar-right{display:flex;align-items:center;gap:20px;}
    .topbar-user{color:rgba(255,255,255,0.5);font-size:13px;}
    .topbar-logout{color:#f4640a;font-size:13px;cursor:pointer;font-weight:600;background:none;border:none;}
    .body{padding:32px;max-width:1200px;margin:0 auto;}
    .page-title{font-size:22px;font-weight:700;color:#0b1f3a;margin-bottom:4px;}
    .page-sub{font-size:13px;color:#888;margin-bottom:28px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
    /* CARDS */
    .card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
    .card-title{font-size:15px;font-weight:700;color:#0b1f3a;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f0f0f0;}
    /* FORM */
    label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.05em;}
    input,select,textarea{width:100%;padding:10px 14px;border:1.5px solid #e8e8e8;border-radius:10px;font-size:14px;outline:none;transition:border 0.2s;margin-bottom:14px;background:#fafafa;}
    input:focus,select:focus,textarea:focus{border-color:#f4640a;background:#fff;}
    textarea{height:80px;resize:vertical;}
    .img-upload{border:2px dashed #e0e0e0;border-radius:10px;padding:24px;text-align:center;cursor:pointer;margin-bottom:14px;transition:border 0.2s;}
    .img-upload:hover{border-color:#f4640a;}
    .img-upload input{display:none;}
    .img-upload p{font-size:13px;color:#aaa;margin-top:8px;}
    .img-preview{width:100%;height:160px;object-fit:cover;border-radius:8px;margin-bottom:14px;display:none;}
    /* BUTTONS */
    .btn{padding:11px 22px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:8px;}
    .btn-primary{background:#f4640a;color:#fff;width:100%;justify-content:center;}
    .btn-primary:hover{background:#d4530a;}
    .btn-danger{background:#fff;color:#dc2626;border:1.5px solid #fecaca;padding:6px 12px;font-size:12px;border-radius:8px;}
    .btn-danger:hover{background:#dc2626;color:#fff;border-color:#dc2626;}
    /* TABLE */
    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    th{text-align:left;font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:0.08em;padding:10px 14px;border-bottom:2px solid #f0f0f0;white-space:nowrap;}
    td{padding:14px;border-bottom:1px solid #f8f8f8;font-size:13px;color:#333;vertical-align:middle;}
    tr:hover td{background:#fafafa;}
    .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#fff3e0;color:#e65100;}
    .product-img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#f0f0f0;}
    .no-img{width:48px;height:48px;border-radius:8px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:18px;}
    /* MSG */
    .msg{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none;}
    .msg.ok{background:#dcfce7;color:#166534;display:block;}
    .msg.err{background:#fee2e2;color:#dc2626;display:block;}
    .empty{text-align:center;padding:48px;color:#ccc;font-size:14px;}
    .count{font-size:13px;color:#888;font-weight:400;margin-left:8px;}
    @media(max-width:768px){.grid2{grid-template-columns:1fr;}}
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginPage">
  <div class="login-box">
    <div class="login-logo">Eland <span>Expert Engineers</span></div>
    <h2>Admin Portal</h2>
    <p>Sign in to manage your products</p>
    <div id="loginMsg" class="msg"></div>
    <label>Username</label>
    <input type="text" id="loginUser" placeholder="Enter username"/>
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="Enter password"/>
    <button class="btn btn-primary" onclick="doLogin()" style="margin-top:8px;">Sign In</button>
  </div>
</div>

<!-- ADMIN -->
<div class="admin" id="adminPage">
  <div class="topbar">
    <div class="topbar-logo">Eland <span>Admin</span></div>
    <div class="topbar-right">
      <span class="topbar-user">Logged in as Eland</span>
      <button class="topbar-logout" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="body">
    <div class="page-title">Products Management</div>
    <div class="page-sub">Add, edit or remove products shown on your website product page.</div>

    <div class="grid2">
      <!-- ADD FORM -->
      <div class="card">
        <div class="card-title">Add New Product</div>
        <div id="addMsg" class="msg"></div>
        <label>Product Name *</label>
        <input type="text" id="pName" placeholder="e.g. Pressure Transmitter"/>
        <label>Brand / Manufacturer</label>
        <input type="text" id="pBrand" placeholder="e.g. Endress+Hauser / Rosemount"/>
        <label>Category *</label>
        <select id="pCategory">
          <option value="">Select category...</option>
          <option>Instrumentation</option>
          <option>Electrical</option>
          <option>Automation</option>
          <option>Water Analytics</option>
          <option>Safety Systems</option>
          <option>Other</option>
        </select>
        <label>Description</label>
        <textarea id="pDesc" placeholder="Brief product description..."></textarea>
        <label>Product Image (optional)</label>
        <div class="img-upload" onclick="document.getElementById('pImage').click()">
          <input type="file" id="pImage" accept="image/*" onchange="previewImg(this)"/>
          <div id="uploadIcon">📷</div>
          <p id="uploadText">Click to upload image (JPG, PNG, WEBP)</p>
        </div>
        <img id="imgPreview" class="img-preview" alt="Preview"/>
        <button class="btn btn-primary" onclick="addProduct()">Add Product</button>
      </div>

      <!-- PRODUCT LIST -->
      <div class="card">
        <div class="card-title">Current Products <span class="count" id="productCount"></span></div>
        <div id="productList"></div>
      </div>
    </div>
  </div>
</div>

<script>
  var ADMIN = 'Eland', PASS = '007';

  function doLogin() {
    var u = document.getElementById('loginUser').value.trim();
    var p = document.getElementById('loginPass').value.trim();
    var msg = document.getElementById('loginMsg');
    if (u === ADMIN && p === PASS) {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('adminPage').style.display = 'block';
      loadProducts();
    } else {
      msg.className = 'msg err';
      msg.textContent = 'Invalid username or password.';
    }
  }

  function doLogout() {
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('adminPage').style.display = 'none';
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
  }

  function previewImg(input) {
    var preview = document.getElementById('imgPreview');
    var text = document.getElementById('uploadText');
    if (input.files && input.files[0]) {
      var reader = new FileReader();
      reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
        text.textContent = input.files[0].name;
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function loadProducts() {
    fetch('/api/products')
      .then(function(r){ return r.json(); })
      .then(function(json){
        var products = json.data || [];
        document.getElementById('productCount').textContent = '(' + products.length + ')';
        var el = document.getElementById('productList');
        if (!products.length) {
          el.innerHTML = '<div class="empty">No products yet.<br>Add your first product.</div>';
          return;
        }
        var html = '<div class="table-wrap"><table><thead><tr><th>Image</th><th>Product</th><th>Category</th><th></th></tr></thead><tbody>';
        products.forEach(function(p) {
          var imgEl = p.image_path
            ? '<img class="product-img" src="/' + p.image_path + '" alt="' + p.name + '"/>'
            : '<div class="no-img">📦</div>';
          html += '<tr>' +
            '<td>' + imgEl + '</td>' +
            '<td><strong>' + p.name + '</strong><br><span style="color:#aaa;font-size:12px;">' + (p.brand||'') + '</span></td>' +
            '<td><span class="badge">' + p.category + '</span></td>' +
            '<td><button class="btn btn-danger" onclick="deleteProduct(' + p.id + ')">Delete</button></td>' +
            '</tr>';
        });
        html += '</tbody></table></div>';
        el.innerHTML = html;
      })
      .catch(function(){ document.getElementById('productList').innerHTML = '<div class="empty">Could not connect to server.</div>'; });
  }

  function addProduct() {
    var name     = document.getElementById('pName').value.trim();
    var brand    = document.getElementById('pBrand').value.trim();
    var category = document.getElementById('pCategory').value;
    var desc     = document.getElementById('pDesc').value.trim();
    var imageFile = document.getElementById('pImage').files[0];
    var msg = document.getElementById('addMsg');

    if (!name || !category) {
      msg.className = 'msg err';
      msg.textContent = 'Product name and category are required.';
      return;
    }

    var formData = new FormData();
    formData.append('name', name);
    formData.append('brand', brand);
    formData.append('category', category);
    formData.append('description', desc);
    formData.append('admin', ADMIN);
    formData.append('password', PASS);
    if (imageFile) formData.append('image', imageFile);

    fetch('/api/products', { method:'POST', body:formData })
      .then(function(r){ return r.json(); })
      .then(function(json){
        if (json.success) {
          msg.className = 'msg ok';
          msg.textContent = 'Product added successfully!';
          document.getElementById('pName').value = '';
          document.getElementById('pBrand').value = '';
          document.getElementById('pCategory').value = '';
          document.getElementById('pDesc').value = '';
          document.getElementById('pImage').value = '';
          document.getElementById('imgPreview').style.display = 'none';
          document.getElementById('uploadText').textContent = 'Click to upload image (JPG, PNG, WEBP)';
          loadProducts();
          setTimeout(function(){ msg.style.display='none'; }, 3000);
        } else {
          msg.className = 'msg err';
          msg.textContent = json.message || 'Failed to add product.';
        }
      })
      .catch(function(){
        msg.className = 'msg err';
        msg.textContent = 'Server error. Please try again.';
      });
  }

  function deleteProduct(id) {
    if (!confirm('Delete this product?')) return;
    fetch('/api/products/' + id, {
      method:'DELETE',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({admin:ADMIN, password:PASS})
    })
    .then(function(r){ return r.json(); })
    .then(function(json){
      if (json.success) loadProducts();
      else alert('Failed to delete.');
    });
  }

  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && document.getElementById('loginPage').style.display !== 'none') doLogin();
  });
</script>
</body>
</html>
